name: Build ReaPack Index

on:
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout reapack-index repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pandoc 
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install reapack-index CLI
        run: gem install reapack-index

      - name: Clone plugin repositories temporarily
        run: |
          mkdir -p temp_repos
          cd temp_repos
          
          git clone https://github.com/n-reaper-plugins/prototype-sequence.git
          git clone https://github.com/n-reaper-plugins/granular-generator.git
          git clone https://github.com/n-reaper-plugins/gain-stage-eq.git
          git clone https://github.com/n-reaper-plugins/gingersnap-repl.git

      # - name: Remove ignored folders
      #   run: |
      #     for repo in temp_repos/*; do
      #       echo "Cleaning $repo..."
      #       rm -rf "$repo/Archive"
      #       rm -rf "$repo/dev"
      #     done

      - name: Keep only dist Lua file
        run: |
          for repo in temp_repos/*; do
            echo "Processing $repo..."

            lua_file=$(find "$repo/dist" -maxdepth 1 -type f -name '*.lua' -print -quit)

            if [ -z "$lua_file" ]; then
              echo "ERROR: No .lua file found in $repo/dist"
              exit 1
            fi

            echo "Keeping: $lua_file"

            # Remove everything except the dist directory
            for item in "$repo"/* "$repo"/.[!.]* "$repo"/..?*; do
              [ -e "$item" ] || continue

              if [ "$item" != "$repo/dist" ]; then
                rm -rf "$item"
              fi
            done

            # Remove everything inside dist except the selected Lua file
            for item in "$repo/dist"/* "$repo/dist"/.[!.]* "$repo/dist"/..?*; do
              [ -e "$item" ] || continue

              if [ "$item" != "$lua_file" ]; then
                rm -rf "$item"
              fi
            done
          done

      - name: Configure reapack-index
        run: |
          for repo in temp_repos/*; do
            cat > "$repo/.reapack-index.conf" <<'EOF'
          --ignore "Archive/**"
          --ignore "dev/**"
          EOF
          done

      - name: Generate index.xml
        run: |
          # Remove existing output file to start clean
          rm -f index.xml

          # Loop through each cloned repo and merge into index.xml
          for repo in temp_repos/*; do
            echo "Processing $repo..."
            if [ ! -f index.xml ]; then
              reapack-index \
                --no-commit \
                --verbose \
                --output index.xml \
                --name "_n_plugins" \
                --ignore "Archive/" \
                --ignore "dev/" \
                "$repo"
            else
              reapack-index \
                --no-commit \
                --amend \
                --verbose \
                --output index.xml \
                --name "_n_plugins" \
                --ignore "Archive/" \
                --ignore "dev/" \
                "$repo"
            fi
          done

      - name: Clean up temporary clones
        if: always()
        run: |
          rm -rf temp_repos

      - name: Commit and push updated index.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -f index.xml ]; then
            git add index.xml
            if git diff --staged --quiet; then
              echo "No changes detected in index.xml."
            else
              git commit -m "chore: rebuild ReaPack index.xml"
              git push
            fi
          else
            echo "Error: index.xml was not generated by reapack-index."
            exit 1
          fi
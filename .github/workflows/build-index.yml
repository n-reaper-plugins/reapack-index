name: Build ReaPack Index

on:
  workflow_dispatch: # Allows manual triggering from GitHub UI

concurrency:
  group: build-index
  cancel-in-progress: false

env:
  ORG: n-reaper-plugins
  INDEX_NAME: _n_plugins
  # One package per repo, taken from that repo's top-level dist/ folder.
  # Add a repo name here to add a package.
  REPOS: prototype-sequence granular-generator gain-stage-eq gingersnap-repl nested-projects alias-track

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout reapack-index repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Full clones (not shallow): the build reads each dist file's last-commit date and SHA.
      # Nothing is deleted from the clones - they are only read.
      - name: Clone plugin repositories temporarily
        run: |
          set -euo pipefail
          rm -rf temp_repos
          mkdir -p temp_repos
          for repo in $REPOS; do
            git clone --quiet "https://github.com/$ORG/$repo.git" "temp_repos/$repo"
          done

      # Fails if a repo's dist/ does not contain exactly one .lua file with @description and @version.
      # Versions already listed in index.xml are kept, so ReaPack users can still see older releases.
      - name: Generate index.xml
        run: |
          set -euo pipefail
          python3 tools/build_index.py \
            --org "$ORG" \
            --name "$INDEX_NAME" \
            --repos-dir temp_repos \
            --output index.xml \
            $REPOS

      - name: Verify index.xml
        run: |
          set -euo pipefail
          set -- $REPOS
          expected=$#
          found=$(grep -c '<reapack ' index.xml || true)
          echo "packages in index.xml: $found (expected $expected)"
          if [ "$found" -ne "$expected" ]; then
            echo "ERROR: index.xml must contain exactly $expected packages"
            exit 1
          fi
          grep '<reapack ' index.xml | sed 's/ desc=.*//'

      - name: Clean up temporary clones
        if: always()
        run: |
          rm -rf temp_repos

      - name: Commit and push updated index.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add index.xml
          if git diff --staged --quiet; then
            echo "No changes detected in index.xml."
          else
            git commit -m "chore: rebuild ReaPack index.xml"
            git push
          fi

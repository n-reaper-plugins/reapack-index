name: Build ReaPack Index

on:
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout reapack-index repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install reapack-index CLI
        run: gem install reapack-index

      - name: Clone plugin repositories temporarily
        run: |
          mkdir -p temp_repos
          cd temp_repos
          
          git clone --depth 1 https://github.com/n-reaper-plugins/prototype-sequence.git
          git clone --depth 1 https://github.com/n-reaper-plugins/granular-generator.git
          git clone --depth 1 https://github.com/n-reaper-plugins/gain-stage-eq.git
          git clone --depth 1 https://github.com/n-reaper-plugins/gingersnap-repl.git

      - name: Generate index.xml
        run: |
          # Use --no-commit to generate/update index.xml without prompting or committing inside Ruby
          reapack-index --no-commit --name "_n_plugins Plugins" temp_repos/*

      - name: Clean up temporary clones
        if: always()
        run: |
          rm -rf temp_repos

      - name: Commit and push updated index.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.xml
          
          if git diff --staged --quiet; then
            echo "No changes detected in index.xml."
          else
            git commit -m "chore: rebuild ReaPack index.xml"
            git push
          fi